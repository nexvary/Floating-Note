name: Signed Release APK

# Manual only. Signing keys must never be committed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: SDK platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Load signing material securely
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::Configure all four signing secrets first." >&2
            exit 1
          fi
          keyfile="$RUNNER_TEMP/nexvary-production.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keyfile"
          chmod 600 "$keyfile"
          test -s "$keyfile"
          echo "ANDROID_KEYSTORE_PATH=$keyfile" >> "$GITHUB_ENV"
      - name: Lint, unit tests, signed release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --min-sdk-version 26 --verbose --print-certs "$apk"
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-Floating-Note-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Discard signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/nexvary-production.jks"
