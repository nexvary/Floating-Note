name: Android Emulator Smoke

# Emulator cold boots intermittently ANR in Pixel Launcher on GitHub runners.
# Keep this independent diagnostic manual until emulator infrastructure is stable.
on:
  push:
    branches: [dev/foundation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Allow KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot, run database regression tests and smoke test emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest
            bash scripts/emulator-smoke.sh
      - name: Upload actual emulator screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-Floating-Note-emulator-smoke
          path: |
            screenshots/
            smoke-diagnostics.txt
            revoked-overlay-services.txt
          if-no-files-found: warn
